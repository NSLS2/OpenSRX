[workspace]
authors = ["Jakub Wlodek <jwlodek@bnl.gov>"]
channels = ["conda-forge"]
name = "OpenSRX"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
lint = "pre-commit run --all-files"
build = "mkdir -p build && cmake -B build -G Ninja -S . && ninja -C build"
tests = "./build/tests/TestOpenSRX"
build-docs = "cd docs && doxygen Doxyfile"
make-rpm = "./scripts/build-rpm.sh"
make-srpm = "./scripts/build-srpm.sh"
simulator = "./scripts/simulator.py"

[dependencies]
pre-commit = ">=4.5.1,<5"
clang-format = ">=22.1.0,<23"
python = ">=3.13,<3.14"
doxygen = ">=1.9"
pillow = ">=12.2.0,<13"
ninja = ">=1.13.2,<2"
cmake = ">=4.3.2,<5"
